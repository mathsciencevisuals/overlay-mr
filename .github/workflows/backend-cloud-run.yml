name: Backend Cloud Run

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-cloud-run.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Submit Cloud Build
        working-directory: backend
        run: |
          SUBMIT_OUTPUT=$(gcloud builds submit \
            --config cloudbuild.yaml \
            --async \
            --substitutions _SERVICE_NAME=${{ vars.GCP_CLOUD_RUN_SERVICE }},_REGION=${{ vars.GCP_REGION }},_AR_REPOSITORY=${{ vars.GCP_ARTIFACT_REGISTRY_REPOSITORY }},_IMAGE_NAME=${{ vars.GCP_IMAGE_NAME }},_ASSET_BUCKET=${{ vars.GCP_ASSET_BUCKET }} 2>&1)

          echo "${SUBMIT_OUTPUT}"

          BUILD_ID=$(printf '%s\n' "${SUBMIT_OUTPUT}" | sed -n 's#.*builds/\([a-z0-9-]\{10,\}\).*#\1#p' | head -n 1)

          if [ -z "${BUILD_ID}" ]; then
            echo "Unable to determine Cloud Build ID from submit output."
            exit 1
          fi

          echo "Build started: ${BUILD_ID}"

          while true; do
            STATUS=$(gcloud builds describe "${BUILD_ID}" --format="value(status)")
            echo "Cloud Build status: ${STATUS}"

            if [ "${STATUS}" = "SUCCESS" ]; then
              break
            fi

            if [ "${STATUS}" = "FAILURE" ] || [ "${STATUS}" = "CANCELLED" ] || [ "${STATUS}" = "TIMEOUT" ] || [ "${STATUS}" = "EXPIRED" ] || [ "${STATUS}" = "INTERNAL_ERROR" ]; then
              echo "Cloud Build failed with status: ${STATUS}"
              exit 1
            fi

            sleep 10
          done
