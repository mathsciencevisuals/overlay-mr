steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_IMAGE}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_IMAGE}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - ${_IMAGE}
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --memory
      - 512Mi
      - --cpu
      - "1"
      - --min-instances
      - "0"
      - --max-instances
      - "3"
      - --port
      - "8080"
      - --set-env-vars
      - ASSET_BUCKET=${_ASSET_BUCKET},SIGNED_URL_TTL_SECONDS=900,GCP_PROJECT_ID=$PROJECT_ID

substitutions:
  _SERVICE_NAME: overlay-backend
  _REGION: us-central1
  _AR_REPOSITORY: overlay-mr
  _IMAGE_NAME: overlay-backend
  _ASSET_BUCKET: overlay-mr-assets
  _IMAGE: ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}

images:
  - ${_IMAGE}
